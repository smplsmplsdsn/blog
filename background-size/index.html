<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>background-size : 0から目指すWebマスター</title>
<meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1,user-scalable=no" />
<style>
html,body,#sample{width:100%;height:100%;margin:0;padding:0;}
#txt{float:left;padding:10px;background:#fff;color:#333;font-family:Verdana, Geneva, sans-serif;}
p{margin:0 0 5px;padding:0 0 5px;border-bottom:1px solid #ccc;font-size:10px;}

#sample{
background-image:url(background-size.jpg);
background-position:center top;
background-repeat:no-repeat;
}
.type1{
-moz-background-size:auto;
background-size:auto;
}
.type2{
-moz-background-size:cover;
background-size:cover;
}
.type3{
-moz-background-size:contain;
background-size:contain;
}
.type4{
-moz-background-size:100% 100%;
background-size:100% 100%;
}
.type5{
-moz-background-size:100% auto;
background-size:100% auto;
}
.type6{
-moz-background-size:auto 100%;
background-size:auto 100%;
}
</style>
<script type="text/javascript">
function chgClass(elem){
document.getElementById("sample").className = elem.value;
}
</script>
<body>
<div id="sample" class="type1">
<div id="txt">
<p><a href="https://simplesimples.com/web/markup/css/background-size/">背景画像の拡大・縮小 → background-size !</a></p>
<form>
background-size:
<select name="css" onchange="chgClass(this)">
<option value="type1" selected="selected">auto</option>
<option value="type2">cover</option>
<option value="type3">contain</option>
<option value="type4">100% 100%</option>
<option value="type5">100% auto</option>
<option value="type6">auto 100%</option>
</select>
;
</form>
</div>
</div>
</body>
</html>
