<!DOCTYPE html>
<html lang="ja">
<head prefix="og:http://ogp.me/ns#">
<meta charset="utf-8" />
<title>スライドショー</title>
<meta name="robots" content="NONE" />
<meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<link rel="stylesheet" href="slide-2.0.css" />
<style>
  body{
    margin: 0;
    padding: 0;
    background: #eee;
  }

  #a .slideshow-frame{width: 200px;height: 160px;padding: 20px;}  
  #b .slideshow-frame{width: 200px;height: 160px;padding: 20px;}  
  #c .slideshow-frame{width: 100%;height: 250px;}
  #c .slideshow-frame,
  #c .slideshow-nav{max-width:800px;}
    
</style>
</head>
<body>

<div class="slideshow" id="a">
  <div class="slideshow-frame">
    <div class="slideshow-all" data-pos="0">
      <div class="slideshow-unit slideshow-bg" data-image="img/1.jpg">1</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/2.jpg">2</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/3.jpg">3</div>
    </div>
  </div>
  <p class="slideshow-nav-list"></p>
</div>

<div class="slideshow" id="b">
  <div class="slideshow-frame">
    <div class="slideshow-all" data-pos="0">
      <div class="slideshow-unit slideshow-bg" data-image="img/1.jpg">1</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/2.jpg">2</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/3.jpg">3</div>
    </div>
  </div>
  <p class="slideshow-pagination">
    <a class="slideshow-prev"></a>
    <a class="slideshow-next"></a>
  </p>
</div>

<div class="slideshow" id="c">
  <div class="slideshow-frame">
    <div class="slideshow-all" data-pos="0">
      <div class="slideshow-unit slideshow-bg" data-image="img/1.jpg">1</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/2.jpg">2</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/3.jpg">3</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/4.jpg">4</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/5.jpg">5</div>
    </div>
  </div>
  <div class="slideshow-nav">
    <p class="slideshow-nav-list"></p>
    <p class="slideshow-pagination">
      <a class="slideshow-prev js-slideshow-prev"></a>
      <a class="slideshow-next js-slideshow-next"></a>
    </p>
  </div>
</div>

<div class="slideshow" id="d">
  <div class="slideshow-frame">
    <div class="slideshow-all" data-pos="0">
      <div class="slideshow-unit slideshow-bg" data-image="img/1.jpg">1</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/2.jpg">2</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/3.jpg">3</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/4.jpg">4</div>
      <div class="slideshow-unit slideshow-bg" data-image="img/5.jpg">5</div>
    </div>
  </div>
  <div class="slideshow-nav">
    <p class="slideshow-nav-list"></p>
    <p class="slideshow-pagination">
      <a class="slideshow-prev js-slideshow-prev"></a>
      <a class="slideshow-next js-slideshow-next"></a>
    </p>
  </div>
</div>


<script type="text/javascript" src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
<script type="text/javascript" src="slide-2.0.js"></script>
</body>
</html>
