<?php
// current url
if(isset($_SERVER['HTTPS']) and $_SERVER['HTTPS'] == 'on'){$protocol = 'https://';}else{$protocol = 'http://';}
$url = $protocol.$_SERVER['HTTP_HOST'].$_SERVER['REQUEST_URI'];

// bitly echo shorturl($url)
function shorturl($url){
	$url_bitly = "http://api.bit.ly/v3/shorten?login=allinthemind&apiKey=R_3c4f86e9cb073a71809a2de00349e529&longUrl=".urlencode($url)."&format=xml";
    $ch = curl_init();
    curl_setopt($ch, CURLOPT_URL, $url_bitly);
    curl_setopt($ch, CURLOPT_RETURNTRANSFER,1);
    $data = curl_exec($ch);
    curl_close($ch);
    $data_obj = simplexml_load_string($data);
    if((int)$data_obj->status_code == 200){
        return (string)$data_obj->data->url;
    }else{
        return $url;
    }
}
