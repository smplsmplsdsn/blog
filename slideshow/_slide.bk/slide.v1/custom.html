<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォトスライド：0から目指すWebマスター</title>
<meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1,user-scalable=no" />
<link rel="stylesheet" href="/slide/aitm_slide.css" media="all" />
<style>
/*must word:photo_custom*/
#photo_custom_wrap,
#photo_custom figure,
#photo_custom .img_wrap{width:280px;}

#photo_custom_slide,
#photo_custom figure,
#photo_custom .img_wrap{height:210px;}

/*custom*/
#photo_custom_prev{background-image:url(prev.png);}
#photo_custom_next{background-image:url(next.png);}

#photo_custom_slide{width:100%;}

#photo_custom figcaption{
font-size:10px;
font-family:Verdana, Geneva, sans-serif;
line-height:1.2;
}

#photo_custom .top,
#photo_custom .bottom{
padding:3px;
background-color:#000;
color:#aaa;
}
#photo_custom_wrap{border:1px solid #999;}

#photo_custom{
-webkit-transition: 2s;
-moz-transition: 2s;
-ms-transition: 2s;
transition: 2s;
}
#photo_custom .caption_on .top,
#photo_custom .caption_on .bottom{
-webkit-transition: 1s;
-moz-transition: 1s;
-ms-transition: 1s;
transition: 1s;
}

</style>
<script src="/slide/aitm_slide.js"></script>
<script>
/*ie で html5要素認識用*/
(function(){
	if(!/*@cc_on!@*/0)return;
	var e = "abbr,article,aside,audio,bb,canvas,datagrid,datalist,details,dialog,eventsource,figure,footer,header,hgroup,mark,menu,meter,nav,output,progress,section,time,video".split(',');
	for(var i=0;i<e.length;i++){
		document.createElement(e[i]);
	}
})();

window.onload = function(){
	photoSlide("photo_custom");
}
</script>
<body>

<div id="photo_custom_slide" class="photo_slide">
<div id="photo_custom_prev" class="photo_prev"><div>前へ</div></div>
<div id="photo_custom_wrap" class="photo_wrap">
<div id="photo_custom" class="photo">

<figure class="caption_off">
<div class="img_wrap"><img src="1.jpg" alt="" /></div>
<figcaption>
<p class="bottom">下テキスト1</p>
</figcaption>
</figure>

<figure class="caption_off">
<div class="img_wrap"><img src="2.jpg" alt="" /></div>
<figcaption>
<p class="bottom">下テキスト2</p>
</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="3.jpg" alt="" /></div>
<figcaption>
<p class="bottom">下テキスト3</p>
</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="4.jpg" alt="" /></div>
<figcaption>
<p class="bottom">はみ出たとこは非表示でセンタリング</p>
</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="5.jpg" alt="" /></div>
<figcaption>
<p class="bottom">センタリング表示</p>
</figcaption>
</figure>

</div>
</div>
<div id="photo_custom_next" class="photo_next"><div>次へ</div></div>
<!--.photo_slide--></div>

</body>
</html>
