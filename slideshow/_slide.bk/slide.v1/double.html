<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>フォトスライド：0から目指すWebマスター</title>
<meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1,user-scalable=no" />
<link rel="stylesheet" href="/slide/aitm_slide.css" media="all" />
<style>
#photo_doubleA_wrap,
#photo_doubleA figure,
#photo_doubleA .img_wrap{width:250px;}

#photo_doubleA_slide,
#photo_doubleA figure,
#photo_doubleA .img_wrap{height:188px;}

#photo_doubleB_wrap,
#photo_doubleB figure,
#photo_doubleB .img_wrap{width:300px;}

#photo_doubleB_slide,
#photo_doubleB figure,
#photo_doubleB .img_wrap{height:225px;}
</style>
<script src="/slide/aitm_slide.js"></script>
<script>
/*ie で html5要素認識用*/
(function(){
	if(!/*@cc_on!@*/0)return;
	var e = "abbr,article,aside,audio,bb,canvas,datagrid,datalist,details,dialog,eventsource,figure,footer,header,hgroup,mark,menu,meter,nav,output,progress,section,time,video".split(',');
	for(var i=0;i<e.length;i++){
		document.createElement(e[i]);
	}
})();

window.onload = function(){
	photoSlide("photo_doubleA");
	photoSlide("photo_doubleB");
}
</script>
<body>

<div id="photo_doubleA_slide" class="photo_slide">
<div id="photo_doubleA_prev" class="photo_prev"><div>前へ</div></div>
<div id="photo_doubleA_wrap" class="photo_wrap">
<div id="photo_doubleA" class="photo">

<figure class="caption_off">
<div class="img_wrap"><img src="1.jpg" alt="" /></div>
<figcaption>
<p class="top">上テキスト1</p>
<p class="bottom">下テキスト1</p>
</figcaption>
</figure>

<figure class="caption_off">
<div class="img_wrap"><img src="2.jpg" alt="" /></div>
<figcaption>
<p class="top">上テキスト2</p>
<p class="bottom">下テキスト2</p>
</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="3.jpg" alt="" /></div>
<figcaption>
<p class="top">上テキスト3</p>
<p class="bottom">下テキスト3</p>
</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="4.jpg" alt="" /></div>
<figcaption>
<p class="top">画像が大きい場合</p>
<p class="bottom">はみ出たとこは非表示でセンタリング</p>
</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="5.jpg" alt="" /></div>
<figcaption>
<p class="top">画像が小さい場合</p>
<p class="bottom">センタリング表示</p>
</figcaption>
</figure>

</div>
</div>
<div id="photo_doubleA_next" class="photo_next"><div>次へ</div></div>
<!--.photo_slide--></div>


<div id="photo_doubleB_slide" class="photo_slide">
<div id="photo_doubleB_prev" class="photo_prev"><div>前へ</div></div>
<div id="photo_doubleB_wrap" class="photo_wrap">
<div id="photo_doubleB" class="photo">

<figure class="caption_off">
<div class="img_wrap"><img src="1.jpg" alt="" /></div>
<figcaption>
<p class="top">上テキスト1</p>
<p class="bottom">下テキスト1</p>
</figcaption>
</figure>

<figure class="caption_off">
<div class="img_wrap"><img src="2.jpg" alt="" /></div>
<figcaption>
<p class="top">上テキスト2</p>
<p class="bottom">下テキスト2</p>
</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="3.jpg" alt="" /></div>
<figcaption>
<p class="top">上テキスト3</p>
<p class="bottom">下テキスト3</p>
</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="4.jpg" alt="" /></div>
<figcaption>
<p class="top">画像が大きい場合</p>

</figcaption>
</figure>
<figure class="caption_off">
<div class="img_wrap"><img src="5.jpg" alt="" /></div>
<figcaption>
<p class="top">画像が小さい場合</p>
<p class="bottom">センタリング表示</p>
</figcaption>
</figure>

</div>
</div>
<div id="photo_doubleB_next" class="photo_next"><div>次へ</div></div>

</body>
</html>
