<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>補色と反転デモ</title>
<meta name="viewport" content="initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
<style type="text/css">
html,body,.wrapper{width:100%;height:100%;}
body{margin:0;padding:0;background:#fff;color:#000;font-family:sans-serif;}
.container{position:absolute;top:50%;left:0;width:100%;margin:-50px 0 0 10px;}
.container h1{margin:0 0 10px;padding:0;font-size:48px;}
.container p{margin:0 100px 0 0;padding:0;font-size:14px;}
</style>
</head>
<body>
<div class="wrapper">
  <div class="container">
    <h1>Color</h1>
    <p>1秒ごとに背景色が変化し、テキスト色は背景色を反転します。</p>
  </div>
</div>
<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
<script type="text/javascript" src="./color-complement.js"></script>
<script type="text/javascript">
$(function(){
  function getRandom() {
    var n = Math.floor(Math.random()*256);
    return (n == 256)? 255: n;
  }

  function setColor() {
    var v = Color.info(getRandom() + ',' + getRandom() + ',' + getRandom());
    if (v) {
      $('body').css({background: v['16'], color: v['reversal16']});
    }
    setTimeout(setColor, 1000);
  }
  setColor();
});
</script>
</body>
</html>
