<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>imgタグで、containやcoverするサンプル</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
      img {
        width: 300px;
        height: 300px;
        border-radius: 30px;
        border: 2px solid #000;
        background: #000;
      }
      .sample1 {
        object-fit: cover;
      }
      .sample2,
      .sample3 {
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <h1>imgタグで、containやcoverするサンプル</h1>
    
    <img class="sample1" src="test1.jpg">
    <img class="sample2" src="test1.jpg">
    <img class="sample3" src="test2.jpg">

  </body>
</html>
