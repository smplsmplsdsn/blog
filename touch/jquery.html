<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title></title>
<meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="format-detection" content="telephone=no" />
<style type="text/css">
#test{display:block;padding:20px;background:#eee;cursor:pointer;}
#test.protected{background:#666;}
</style>
</head>
<body>
<h1><a>スマホでマウスオーバー jQuery版</a></h1>
<p><a href="./">ベーシック版</a></p>
<hr />
<a id="test">これはテスト</a>

<!-- jquery版 -->
<script type="text/javascript" src="http://code.jquery.com/jquery-1.7.2.min.js"></script>
<script type="text/javascript">
function test (e) {
	var v = ('this is test' == e.html())? 'これはテスト' : 'this is test';
	e.html(v);
	return false;
}
var flag_link = true;
var a = $('#test');
if ("object" == typeof document.documentElement.ontouchend) {
	a
	.bind("touchstart", function () {
		$(this).addClass('protected');
	})
	.bind("touchmove", function () {
		flag_link = false;
	})
	.bind("touchend", function () {
		$(this).removeClass('protected');
		if (flag_link) {
			test($(this));
		}
		flag_link = true;
	});
} else {
	a.click(function () {
		test($(this));
	});
}
</script>
</body>
</html>
