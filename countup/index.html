<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>カウントアップ/カウントダウン</title>
</head>

<body>
<h1>カウントアップ/カウントダウンするサンプル</h1>
<dl>
  <dt>5から10まで1秒ごとにカウントアップする</dt>
  <dd>
    <p class="js-sample-1"></p>
  </dd>
  <dt>0から150まで0.1秒ごとにカウントアップする</dt>
  <dd>
    <p class="js-sample-2"></p>
  </dd>
  <dt>10から0まで1秒ごとにカウントダウンし、終了時に「Start!!」と表示する</dt>
  <dd>
    <p class="js-sample-3"></p>
  </dd>
  <dt>100から0まで0.1秒ごとにカウントダウンし、終了時に「Start!!」と表示する</dt>
  <dd>
    <p class="js-sample-4"></p>
  </dd>
  <dt>100から300まで0.5秒ごとに7ずつカウントアップする</dt>
  <dd>
    <p class="js-sample-5"></p>
  </dd>
  <dt>0から50まで1秒ごとにカウントアップする。数字をクリックしても最後の値に変更しない（デフォルトは数字をクリックすると最後の値になり、カウントを途中で終了します）</dt>
  <dd>
    <p class="js-sample-6"></p>
  </dd>
</dl>
  
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="countup.js"></script>
<script>
$(function(){
  
  countup($(".js-sample-1"), 5, 10);

  countup($(".js-sample-2"), 0, 150, 100);  
  
  countup($(".js-sample-3"), 10, 0, function(){
    $(".js-sample-3").html("Start!!");
  });  
  
  countup($(".js-sample-4"), 100, 0, {
    speed: 100,
    func: function(){
      $(".js-sample-4").html("Start!!");
    }
  });  
  
  countup($(".js-sample-5"), 100, 300, {
    speed: 500,
    unit: 7
  });  

  countup($(".js-sample-6"), 0, 50, {
    is_not_click: true
  });  
  
  
});  
</script>
</body>
</html>
